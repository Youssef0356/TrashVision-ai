<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  }
  .icon-canvas {
    width: 1024px;
    height: 1024px;
    border-radius: 228px; /* Standard Apple 1024x1024 squircle radius */
    background: linear-gradient(145deg, #FF9E00 0%, #FF6F00 50%, #E65100 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 40px 100px rgba(255, 111, 0, 0.45);
  }
  /* Subtle inner rim light */
  .icon-canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 228px;
    border: 4px solid rgba(255, 255, 255, 0.35);
    box-shadow: inset 0 2px 20px rgba(255, 255, 255, 0.5), inset 0 -4px 15px rgba(0, 0, 0, 0.2);
    pointer-events: none;
  }
  /* Ambient subtle grid texture for AI vision aesthetic */
  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18) 1.5px, transparent 1.5px);
    background-size: 36px 36px;
    opacity: 0.7;
  }
  /* Central glowing disc */
  .core-glow {
    position: absolute;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 70%);
  }
  /* Vector Logo Symbol */
  svg.symbol {
    width: 580px;
    height: 580px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 20px 30px rgba(180, 50, 0, 0.35));
  }
</style>
</head>
<body>
<div class="icon-canvas">
  <div class="grid-pattern"></div>
  <div class="core-glow"></div>
  <svg class="symbol" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Camera AI Reticle Brackets (4 Corners) -->
    <!-- Top-Left -->
    <path d="M 32 60 L 32 40 Q 32 32 40 32 L 60 32" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top-Right -->
    <path d="M 140 32 L 160 32 Q 168 32 168 40 L 168 60" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Left -->
    <path d="M 32 140 L 32 160 Q 32 168 40 168 L 60 168" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Right -->
    <path d="M 140 168 L 160 168 Q 168 168 168 160 L 168 140" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Precision Aperture Ring -->
    <circle cx="100" cy="100" r="54" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="14 10" opacity="0.65"/>
    <circle cx="100" cy="100" r="42" fill="#FFFFFF" fill-opacity="0.12"/>

    <!-- Geometric Eco Transformation Sprout / Leaf Mark -->
    <!-- Primary Leaf curving upward -->
    <path d="M 100 138 C 100 138 72 118 72 88 C 72 65 92 56 100 52 C 108 56 128 65 128 88 C 128 118 100 138 100 138 Z" 
          fill="#FFFFFF" />
    
    <!-- Central Leaf Vein cutting cleanly through -->
    <path d="M 100 62 L 100 132" stroke="#FF7A00" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Secondary Dynamic Eco Leaf accent -->
    <path d="M 100 96 C 114 96 126 88 132 76 C 132 94 118 106 100 108 Z" 
          fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- AI Sparkle / Clean Star at Top Right -->
    <path d="M 152 46 Q 152 54 160 54 Q 152 54 152 62 Q 152 54 144 54 Q 152 54 152 46 Z" 
          fill="#FFFFFF"/>
  </svg>
</div>
</body>
</html>
